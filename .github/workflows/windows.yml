name: Distribution Windows E9
on:
  pull_request:
  push:
    branches: [e9-publication, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dépendances et tests Python
        shell: pwsh
        run: |
          python -m pip install -r packaging/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests
          exit $LASTEXITCODE
      - name: Tests Constat
        shell: pwsh
        run: |
          npm ci --prefix plugins/constat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test --prefix plugins/constat
          exit $LASTEXITCODE
      - name: Construction et contrôles du binaire
        run: python packaging/construire.py --sortie dist/E9
      - uses: actions/upload-artifact@v4
        with:
          name: PRISME-Windows-x64-${{ github.sha }}
          path: |
            dist/E9/*.zip
            dist/E9/*.json
            dist/E9/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
